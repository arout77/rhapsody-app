        data-base-offset="100"

        <!-- Capability 1 -->
        <div

            <p class="text-tagline-3 font-inter-tight font-normal text-white/60">

            </p>
          </div>
        </div>

        <!-- Capability 2 -->
        <div
          class="bg-background-5 capabilities-card flex h-[374px] w-full max-w-[322px] flex-col justify-between gap-2 rounded-lg p-8"

              Provide instant, intelligent customer support.
            </p>
          </div>
        </div>

        <!-- Capability 3 -->
        <div
          class="bg-background-5 capabilities-card flex h-[374px] w-full max-w-[322px] flex-col justify-between gap-2 rounded-lg p-8"

            <p class="text-tagline-3 font-inter-tight font-normal text-white/60">
              Monitor performance and adapt with live insights.
            </p>
          </div>
        </div>
      </div>

      <!-- CTA Button -->
      <div class="flex justify-center" data-opai-animate data-delay="0.4">
        <Component
