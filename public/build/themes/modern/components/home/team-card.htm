<article
  data-opai-animate
  data-delay="{=$delay}"
  class="border-stroke-1/10 group bg-background-5 focus:ring-offset-background-1 relative col-span-12 mx-auto max-h-[395px] w-full max-w-[708px] overflow-hidden rounded-xl border md:col-span-6 lg:col-span-4 lg:max-w-[409px]"
  aria-label="Team member profile"
>
  <figure class="size-full grayscale-100 transition-all duration-400 group-hover:grayscale-0">
    <img src="{=$image}" alt="{=$name}, {=$position}" class="size-full object-cover" />
  </figure>
  <div
    class="bg-background-13/50 ease-team-ease-1 absolute bottom-[15px] left-1/2 w-[calc(100%-30px)] -translate-x-1/2 space-y-0.5 rounded-md p-5 backdrop-blur-[3.5px] transition-all duration-400 md:bottom-5 md:w-[calc(100%-40px)] lg:translate-y-[30%] lg:scale-[90%] lg:opacity-0 lg:group-hover:translate-y-0 lg:group-hover:scale-100 lg:group-hover:opacity-100"
  >
    <a href="/team-details.html">
      <h3 class="text-manrope-heading-6 font-medium text-white/80">{=$name}</h3>
    </a>
    <p class="text-tagline-4 font-normal text-white/50">{=$position}</p>
  </div>
</article>
