<article
  class="bg-background-5 border-stroke-1/10 group relative flex min-h-[360px] w-full min-w-[335px] flex-col justify-between overflow-hidden rounded-lg border p-8 backdrop-blur-[57px] first:ml-8 md:min-h-[420px] md:min-w-[408px]"
>
  <div
    class="ease-team-ease-1 absolute top-[-20%] left-[-20%] z-0 size-34 bg-white opacity-0 mix-blend-plus-lighter blur-[25.5px] transition-all duration-500 group-hover:opacity-40"
  ></div>
  <div
    class="bg-opai-blue ease-team-ease-1 absolute top-[-17%] left-[-18%] z-0 size-34 opacity-0 mix-blend-plus-lighter blur-[42px] transition-all duration-500 group-hover:opacity-100"
  ></div>
  <div class="relative z-10 space-y-3">
    <div class="flex items-center gap-1">
      <span><img src="./images/icons/yellow-star.svg" alt="star" /></span>
      <span><img src="./images/icons/yellow-star.svg" alt="star" /></span>
      <span><img src="./images/icons/yellow-star.svg" alt="star" /></span>
      <span><img src="./images/icons/yellow-star.svg" alt="star" /></span>
      <span><img src="./images/icons/yellow-star.svg" alt="star" /></span>
    </div>
    <p class="text-tagline-2 font-normal text-wrap text-white/80">{=$review}</p>
  </div>
  <div class="space-y-3">
    <figure class="size-17.5 overflow-hidden rounded-full">
      <img src="{=$image}" alt="testimonial" class="size-full object-cover grayscale-25" />
    </figure>
    <blockquote class="space-y-0.5">
      <h3 class="text-manrope-heading-6 font-medium text-white/90">{=$name}</h3>
      <p class="text-tagline-3 font-normal text-white/50">{=$position}</p>
    </blockquote>
  </div>
</article>
