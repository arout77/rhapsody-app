<!-- contact form  -->

<section class="pt-26 md:pt-27 lg:pt-39">
  <div class="main-container">
    <div class="space-y-16 lg:space-y-29 xl:space-y-39">
      <div class="space-y-3 text-center">
        <h2
          data-opai-text-reveal
          data-word-delay="0.03"
          data-word-rotation-x="120"
          data-word-offset-y="49"
          class="md:text-sora-heading-3 text-sora-heading-4 lg:text-sora-heading-2 text-center font-normal tracking-[-2.4px] text-white/90 max-md:leading-[1.1]"
        >
          We’d love to Hear from You
        </h2>
        <p
          data-opai-text-reveal
          data-delay="0.2"
          data-word-delay="0.01"
          data-word-offset-y="42"
          class="font-inter-tight text-tagline-2 mx-auto max-w-[320px] font-normal text-white/60"
        >
          Let’s explore how OptimAI can support your goals with AI-driven solutions.
        </p>
      </div>
      <div
        class="border-stroke-3/11 bg-background-5 group relative w-full rounded-xl border-[6px] p-5 md:p-10 lg:p-14"
        data-opai-animate
        data-delay="0.1"
      >
        <div class="relative z-20 space-y-10 md:space-y-14 lg:space-y-19">
          <div class="text-center">
            <h2
              data-opai-text-reveal
              data-word-delay="0.03"
              data-word-rotation-x="120"
              data-word-offset-y="49"
              class="md:text-sora-heading-3 text-sora-heading-4 lg:text-sora-heading-2 text-center font-normal tracking-[-2.4px] text-white/90 max-md:leading-[1.1]"
            >
              Contact form
            </h2>
            <p class="font-inter-tight text-tagline-2 font-normal text-white/60">
              Send us a message, and we'll get back to you within 24 hours.
            </p>
          </div>

          <div
            class="flex flex-col items-center justify-center gap-x-14 gap-y-10 md:flex-row md:gap-y-0"
          >
            <!-- form  -->
            <form action="#" class="w-full space-y-6">
              <div>
                <!-- name  -->
                <fieldset class="mb-6 space-y-2">
                  <label
                    for="name"
                    class="text-inter-tight text-tagline-2 inline-block font-normal text-white/90"
                    >Your name</label
                  >
                  <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    class="border-stroke-1/11 focus-within:border-stroke-1/70 w-full rounded-md border px-4.5 py-3 text-white/90 placeholder:text-white/60 focus-within:outline-none"
                    required
                    aria-label="Your name"
                  />
                </fieldset>

                <!-- email  -->
                <fieldset class="mb-6 space-y-2">
                  <label
                    for="email"
                    class="text-inter-tight text-tagline-2 inline-block font-normal text-white/90"
                    >Your email</label
                  >
                  <input
                    type="text"
                    id="subject"
                    placeholder="Enter your email"
                    class="border-stroke-1/11 focus-within:border-stroke-1/70 w-full rounded-md border px-4.5 py-3 text-white/90 placeholder:text-white/60 focus-within:outline-none"
                    required
                    aria-label="Your email"
                  />
                </fieldset>

                <!-- your message -->
                <fieldset class="mb-4 space-y-2">
                  <label
                    for="message"
                    class="text-inter-tight text-tagline-2 inline-block font-normal text-white/90"
                    >Your message</label
                  >
                  <textarea
                    id="message"
                    placeholder="Enter your message"
                    class="border-stroke-1/11 focus-within:border-stroke-1/70 h-45.5 w-full rounded-md border px-4.5 py-3 text-white/90 placeholder:text-white/60 focus-within:outline-none"
                  ></textarea>
                </fieldset>

                <!-- remember me  and forget password  -->
                <fieldset class="mb-14 flex items-center justify-between gap-x-5">
                  <label class="flex cursor-pointer items-center gap-1.5">
                    <input
                      type="checkbox"
                      name="terms"
                      required=""
                      class="peer sr-only"
                      aria-label="I accept with the Terms of uses and privacy policy"
                    />
                    <span
                      class="border-stroke-3/18 peer-checked:border-primary-500 relative size-5 cursor-pointer rounded-[2px] border after:absolute after:top-1/2 after:left-1/2 after:size-3 after:-translate-x-1/2 after:-translate-y-1/2 after:rounded-[2px] after:bg-white/50 after:opacity-0 peer-checked:after:opacity-100"
                    ></span>
                    <span
                      class="text-tagline-3 font-medium text-white/60 select-none peer-checked:text-white/90"
                    >
                      I accept with the Terms of uses and privacy policy
                    </span>
                  </label>
                </fieldset>

                <!-- submit request button  -->
                <div class="inline-block">
                  <Component
                    src="src/components/shared/button/submit-primary.htm"
                    button-text="Submit request"
                  />
                </div>
              </div>
            </form>

            <!-- img  -->

            <div
              class="rounded- ring-background-3 h-[563px] w-full rounded-xl ring-8"
              data-opai-animate
              data-delay="0.2"
            >
              <figure class="relative size-full overflow-hidden rounded-lg">
                <img
                  src="./images/opai-img-261.png"
                  alt="contact-form-img"
                  class="size-full object-cover"
                />

                <div
                  class="bg-background-13/20 absolute top-1/2 left-1/2 flex h-12 w-[334px] -translate-x-1/2 -translate-y-1/2 items-center justify-center gap-x-2.5 rounded-lg backdrop-blur-[12px]"
                >
                  <span> </span>

                  <span class="font-inter-tight text-tagline-3 font-normal text-white/90">
                    1320 Geoage ST Brisbane, QLD, Japan 4009
                  </span>
                </div>
              </figure>
            </div>
          </div>
        </div>

        <div
          class="flex flex-col justify-between gap-x-10 gap-y-10 pt-8 md:flex-row md:items-center md:pt-10 lg:gap-x-19 lg:pt-14"

          <div class="space-y-6 p-4 md:p-8">

            <div class="space-y-0.5">

                >hello@optimai.com</a

            </span>
            <div class="space-y-0.5">
              <h4 class="text-inter-tight text-xl font-normal text-white/90">Phone</h4>
              <a href="tel:+12025550130" class="text-tagline-2 font-normal text-white/60"
                >+1 (202) 555-0130</a
              >
            </div>
          </div>
          <div class="space-y-6 p-4 md:p-8">
            <span class="inline-block">

                  stroke="#F8F9FA"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <div class="space-y-0.5">
              <h4 class="text-inter-tight text-xl font-normal text-white/90">Location</h4>
              <a href="#" class="text-tagline-2 font-normal text-white/60">
                1320 Geoage ST Brisbane, QLD, Japan 4009
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
