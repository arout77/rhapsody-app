<!-- =============================== why choose ============================== -->
<section class="py-17 md:py-26 lg:py-28 xl:py-33 2xl:py-39">
  <div class="main-container">
    <div class="space-y-10 md:space-y-14 lg:space-y-17.5">
      <!-- Header Section -->
      <div class="space-y-7 text-center md:space-y-12">
        <h2
          data-opai-text-reveal
          data-word-delay="0.1"
          data-word-rotation-x="120"
          data-word-offset-y="50"
          class="lg:text-sora-heading-2 md:text-sora-heading-3 text-sora-heading-4 font-normal tracking-[-2.4px] text-white/90 max-md:leading-[1.1]"
        >
          Why <span class="text-white/30">OptimAI?</span>
        </h2>
        <!-- Avatars and Trust Indicator -->
        <div class="flex items-center justify-center gap-4 max-[375px]:flex-col">
          <div class="flex -space-x-2.5">
            <img
              data-opai-avatar
              data-avatar-delay="0.2"
              class="inline-block size-9 rounded-full ring-2 ring-white"
              src="./images/opai-avatar-img-01.png"
              alt="Avatar 1"
            />
            <img
              data-opai-avatar
              data-avatar-delay="0.3"
              class="inline-block size-9 rounded-full ring-2 ring-white"
              src="./images/opai-avatar-img-02.png"
              alt="Avatar 2"
            />
            <img
              data-opai-avatar
              data-avatar-delay="0.4"
              class="inline-block size-9 rounded-full ring-2 ring-white"
              src="./images/opai-avatar-img-03.png"
              alt="Avatar 3"
            />
            <img
              data-opai-avatar
              data-avatar-delay="0.5"
              class="inline-block size-9 rounded-full ring-2 ring-white"
              src="./images/opai-avatar-img-04.png"
              alt="Avatar 4"
            />
            <div
              data-opai-avatar
              data-avatar-delay="0.6"
              class="text-tagline-4 inline-flex size-9 items-center justify-center rounded-full bg-[#0d0d1280] font-medium text-white/80 ring-2 ring-white backdrop-blur-[6px]"
            >
              99+
            </div>
          </div>
          <div class="text-left max-[375px]:text-center">
            <p
              class="text-tagline-3 block font-medium text-white/90"
              data-opai-animate
              data-delay="0.3"
            >
              Trusted by
              <span
                data-counter-trigger
                data-counter-value="200"
                data-counter-duration="1.8"
                class="inline-flex items-baseline"
              >
                <number-flow data-counter-number></number-flow><span>+</span>
              </span>
            </p>
            <p class="text-tagline-4 text-white/60" data-opai-animate data-delay="0.4">
              Customers across the globe
            </p>
          </div>
        </div>
      </div>

      <!-- Feature cards grid -->
      <div class="grid grid-cols-1 items-center gap-6 md:grid-cols-3 lg:gap-8">
        <!-- Card 01 -->
        <div
          data-opai-animate
          data-delay="0.3"
          class="bg-background-4 flex h-[347px] flex-col items-center justify-end rounded-xl px-11 py-9 md:px-4 lg:px-11"
        >
          <h3 class="text-sora-heading-5 text-left font-normal tracking-[-0.72px] text-white">
            Save hours of design and rendering time
          </h3>
        </div>

        <!-- Cards 02 & 03 -->
        <div class="flex flex-col gap-8">
          <!-- Card 02 -->
          <div
            data-opai-animate
            data-delay="0.2"
            class="bg-background-4 flex h-[347px] flex-col items-center justify-end rounded-xl px-11 py-9 md:px-4 lg:px-11"
          >
            <h3 class="text-sora-heading-5 text-left font-normal tracking-[-0.72px] text-white">
              Scale visual content across formats, styles, and platforms
            </h3>
          </div>

          <!-- Card 03 -->
          <div
            data-opai-animate
            data-delay="0.3"
            class="bg-background-4 flex h-[347px] flex-col items-center justify-end rounded-xl px-11 py-9 md:px-4 lg:px-11"
          >
            <h3 class="text-sora-heading-5 text-left font-normal tracking-[-0.72px] text-white">
              Customize outputs with ease—no design background required
            </h3>
          </div>
        </div>

        <!-- Card 04 -->
        <div
          data-opai-animate
          data-delay="0.6"
          class="bg-background-4 relative flex h-[347px] flex-col items-center justify-end overflow-hidden rounded-xl px-11 py-9 md:px-4 lg:px-11"
        >
          <!-- Background image/gradient -->
          <figure class="absolute inset-0 size-full">
            <img src="./images/opai-img-3.jpg" alt="" class="size-full object-cover" />
          </figure>
          <!-- Gradient overlay -->
          <div
            class="absolute inset-0 size-full bg-[linear-gradient(223deg,_rgba(13,16,23,0)_54%,_rgba(13,16,23,0.6)_83%,_rgba(13,16,23,1)_100%)]"
            aria-hidden="true"
          ></div>
          <h3
            class="text-sora-heading-5 relative z-10 text-left font-normal tracking-[-0.72px] text-white"
          >
            Export ready-to-use assets for web, print, or AR/VR
          </h3>
        </div>
      </div>

      <!-- CTA Button -->
      <div class="flex justify-center" data-opai-animate data-delay="0.1">
        <Component
          src="src/components/shared/button/button-primary.htm"
          button-text="Talk to our AI experts"
          anchor-class="w-[85%] md:w-auto"
          href="./contact.html"
        />
      </div>
    </div>
  </div>
</section>
